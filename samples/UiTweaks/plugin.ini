; Plugin-Beschreibung fuer den AMS.5-Plugin-Manager.
; Der Ordner unter BIN\plugins\ muss so heissen wie Name=.
Name=UiTweaks
Module=UiTweaks.bpl
Version=1.0.0

LargeGlyph=./icon32.png

; ===========================================================================
;  SO GEHT ES: im Ribbon auf "Elemente suchen" klicken.
;
;    1. Suchbegriff eingeben - Name, Beschriftung oder Klasse, Teiltreffer
;       genuegen. "*" und "?" sind erlaubt, leer zeigt alles.
;       Ein Fensterhandle aus AutoIt Window Info ("0x00650E98") geht auch.
;    2. Treffer in der oberen Liste anklicken -> unten stehen alle
;       Eigenschaften mit Typ und aktuellem Wert. "r" heisst nur lesbar.
;    3. "Zeigen" (oder Doppelklick auf den Treffer) laesst das Element im
;       AMS-Fenster blinken - so sieht man vor dem Aendern, ob es das
;       richtige ist. Gleichzeitig landen alle Einzelheiten im Log
;       (%TEMP%\UiTweaks.log). Ribbon-Elemente haben kein eigenes Fenster
;       und lassen sich nicht hervorheben; das sagt die Statuszeile dann.
;    4. Eigenschaft anklicken -> im Feld ganz unten steht die fertige
;       Patchzeile mit dem AKTUELLEN Wert. Wert anpassen, dann:
;         "Anwenden"       sofort ausprobieren
;         "Kopieren"       in die Zwischenablage, hier unter [Patch] einfuegen
;         "Zuruecknehmen"  alles rueckgaengig
; ===========================================================================

; ===========================================================================
;  [Patch] - vorhandene Elemente des Hosts beim Start aendern
;
;  Aufbau:   Element.Eigenschaft=Wert
;
;  "Element" wird gegen den Komponentennamen UND die Beschriftung geprueft,
;  "*" und "?" sind erlaubt. Getrennt wird am ERSTEN Punkt - alles danach
;  ist der Eigenschaftspfad und darf selbst Punkte enthalten (Font.Size).
;
;  Werte:
;    Zahl        42   $FF   0x1F   #FF8800   clRed
;    Ja/Nein     1  0  ja  nein  an  aus
;    Auswahl     ivNever, ivAlways ... (Namen wie in Delphi) oder die Zahl
;    Menge       [fsBold,fsItalic]   [] fuer leer
;
;  ALLES HIER WIRD BEIM ENTLADEN DES PLUGINS ZURUECKGENOMMEN.
;
;  Die Zeilen unten sind Beispiele und auskommentiert - die Namen
;  unterscheiden sich je nach AMS-Installation.
; ===========================================================================
[Patch]
; acOVermittler.Visible=0
; bbLoeschen.Enabled=0
; bbLoeschen.Hint=Loeschen ist in diesem Mandanten gesperrt
; Speichern.Caption=Sichern
; bbSpeichern.Font.Style=[fsBold]
; pnHinweis.Color=#FFF4C2
; pnHinweis.Height=48

; ===========================================================================
;  [Suche] - Vorbelegung des Suchfensters
; ===========================================================================
[Suche]
; Steht hier etwas, wird beim Oeffnen gleich danach gesucht.
Text=
; Obergrenze der angezeigten Treffer.
MaxTreffer=500

; ===========================================================================
;  [Hook] - OnClick eines vorhandenen Elements mithoeren.
;  CallOriginal=1 ruft zuerst die urspruengliche Behandlung des Hosts,
;  0 ersetzt sie. Nur Ereignisse vom Typ TNotifyEvent.
; ===========================================================================
[Hook]
Element=
CallOriginal=1
