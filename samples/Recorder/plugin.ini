; Plugin-Beschreibung fuer den AMS.5-Plugin-Manager.
; Der Ordner unter BIN\plugins\ muss so heissen wie Name=.
Name=Recorder
Module=Recorder.bpl
Version=1.0.0

LargeGlyph=./icon32.png

[Aufzeichnung]
; Was mitgeschrieben wird. Wer nur wissen will, welcher Klick welche Action
; ausloest, schaltet SQL ab - die Datei wird dann um ein Vielfaches kuerzer.
SQL=1
Actions=1
Klicks=1

; Ab dieser Laenge werden SQL-Texte gekuerzt.
MaxDetail=500

; Wie viele Zeilen das Fenster im Speicher haelt.
Zeilenpuffer=2000

; Zusaetzlich ins normale Log schreiben, eingerueckt nach Verschachtelung.
; Bequem zum Mitlesen, aber langsamer - bei SQL nicht empfohlen.
AuchInsLog=0

; Verlaufsfenster sofort mit dem Hauptfenster oeffnen, ohne Knopfdruck.
; Dafuer gedacht, das Hochfahren von AMS selbst zu beobachten.
FensterBeimStart=0
