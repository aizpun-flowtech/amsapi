; Plugin-Beschreibung fuer den AMS.5-Plugin-Manager.
; Der Ordner unter BIN\plugins\ muss so heissen wie Name=.
Name=Doom
Module=Doom.bpl
Version=1.0.0

LargeGlyph=./icon32.png

; ===========================================================================
;  DOOM im laufenden AMS - eingebettet (kein eigenes Fenster).
;
;  Im Ribbon auf "DOOM" klicken. Die Spielflaeche haengt sich IN das
;  AMS-Fenster.
;
;  ECHTES DOOM (mit echten Leveln, Gegnern, Waffen):
;    1. native\build_doomcore.bat einmal ausfuehren (braucht Visual Studio) -
;       erzeugt doomcore.dll. build.cmd kopiert sie dann neben Doom.bpl.
;    2. Ein IWAD danebenlegen: DOOM1.WAD (Shareware) fuer die echten
;       id-Level, oder freedoom1.wad. Entweder in den Plugin-Ordner oder
;       hier unter Wad= den Pfad angeben.
;  Fehlt doomcore.dll oder das WAD, laeuft automatisch die erzeugte
;  Pascal-Ersatz-Engine - das Plugin startet in jedem Fall.
;
;  Steuerung: Pfeile/WASD laufen & drehen, Strg feuern, Leertaste benutzen,
;  Umschalt rennen, Zahlen Waffenwahl, Esc DOOM-Menue.
; ===========================================================================

[Doom]
; Pfad zu einem IWAD. Leer = automatisch neben dem Plugin suchen
; (DOOM1.WAD, doom.wad, freedoom1.wad ...).
Wad=

; Verzeichnis fuer Spielstaende und Konfiguration. Leer = %APPDATA%\AmsDoom
; (immer pro-Benutzer beschreibbar, ohne Adminrechte). WICHTIG: Ohne ein
; beschreibbares Verzeichnis wuerde DOOM ins Programmverzeichnis von AMS
; schreiben - dort scheitert jedes Speichern still.
SaveDir=

; Zusaetzliche DOOM-Kommandozeile fuer den echten Kern. Beispiele:
;   -warp 1 1     direkt in Episode 1, Level 1 starten
;   -skill 3      Schwierigkeitsgrad
; Leer = normaler Titelbildschirm.
Extra=

; Betriebsart:
;   embed  = Flaeche IN das AMS-Fenster haengen (Standard, kein eigenes Fenster)
;   window = eigenes Fenster (Notloesung, falls das Einbetten in dieser
;            AMS-Version nicht sichtbar wird)
Mode=embed

; Wohin die Spielflaeche eingebettet wird. Leer = AMS-Hauptfenster.
; Traegt man hier den NAMEN (oder die Beschriftung) eines Bedienelements ein -
; z.B. die aktive Tab-/Dokumentseite, deren Namen das UiTweaks-Suchfenster
; liefert -, sitzt DOOM in genau diesem Element (also in einem Tab von AMS).
Container=

; Raender der eingebetteten Flaeche im Container (Pixel). Standard laesst oben
; Platz fuer Ribbon + Tableiste, damit der DOOM-Knopf sichtbar bleibt
; (nochmal draufklicken schliesst DOOM wieder). An die eigene AMS-Ansicht
; anpassen, bis die Flaeche im Dokumentbereich sitzt.
Top=116
Left=0
Right=0
Bottom=0

; Randfarbe um das Bild (das 4:3-Bild wird zentriert, der Rest ist Rand).
; Standard weiss - passt zur hellen AMS-Oberflaeche. Auch: black/schwarz,
; clRed & Co., #RRGGBB.
Background=white

; ===========================================================================
;  [Info] - was der Plugin Manager anzeigt. AMS liest diesen Abschnitt nicht.
; ===========================================================================
[Info]
Title=DOOM
Description=DOOM als eigener Reiter in AMS - der echte Kern mit echten Leveln, wenn doomcore.dll und eine WAD da sind, sonst eine Ersatz-Engine.
Author=Flowtech
License=intern
Tags=Spiel
Icon=icon32.png
