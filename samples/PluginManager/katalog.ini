; ===========================================================================
;  Plugin-Katalog fuer den AMS Plugin Manager
;
;  Jeder Abschnitt ist ein Plugin. Der Abschnittsname ist der Ordnername
;  unter BIN\plugins und muss zu Name= in dessen plugin.ini passen.
;
;  Repo=github:<owner>/<repo>   Quelle auf GitHub (auch https://github.com/...)
;                                Ausgeliefert wird ueber das neueste Release:
;                                Assets <Name>.zip und <Name>.ini.
;                                build.cmd legt beide unter build\release\ ab.
;  Path=<ordner>                 Unterordner im Repo mit README.md, plugin.ini
;                                und Bild - fuer Repos mit mehreren Plugins
;  Branch=<zweig>                fuer README und Bilder, Standard HEAD
;  Tag=v1.2.0                    feste Version statt der neuesten
;  Asset= / MetaAsset=           andere Asset-Namen
;  Sha256=<hex>                  Paket muss genau diese Pruefsumme haben
;
;  Ohne GitHub (Webserver, Netzlaufwerk, lokaler Ordner):
;  Base=<URL oder Ordner>        dort liegen <Name>.zip (oder gleich der
;                                fertige Plugin-Ordner), plugin.ini, README.md.
;                                Relativ = relativ zu diesem Katalog.
;
;  Einzeln ueberschreibbar: Package=, Meta=, Readme=, Icon=, Page=
;  Anzeige, solange die Quelle nicht erreichbar ist: Title=, Description=,
;  Version=, Author=
; ===========================================================================

[PluginManager]
