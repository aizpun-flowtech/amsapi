; Plugin-Beschreibung fuer den AMS.5-Plugin-Manager.
; Der Ordner unter BIN\plugins\ muss so heissen wie Name=.
Name=PluginManager
Module=PluginManager.bpl
Version=1.0.0

LargeGlyph=./icon32.png
Glyph=./icon16.png

; Beschriftung und Hinweis des Ribbon-Knopfs
Caption=Plugin Manager
Hint=Plugins suchen, installieren, aktualisieren und einstellen

; ===========================================================================
;  [Info] - was der Plugin Manager ueber ein Plugin anzeigt
;
;  Jedes Plugin darf diesen Abschnitt haben; AMS selbst liest ihn nicht.
;  Beim Aktualisieren gilt immer der [Info]-Abschnitt der neuen Version.
; ===========================================================================
[Info]
Title=Plugin Manager
Description=Plugins fuer AMS finden, installieren, aktualisieren, entfernen und einstellen - mit Bild, Version und der README direkt aus dem Repo.
Author=Flowtech
License=intern
Tags=Verwaltung
Icon=icon32.png

; ===========================================================================
;  [Katalog] - woher die Plugins kommen
;
;  Jede Quelle ist eine Katalog-INI, als URL oder als Pfad (auch \\Server).
;  Beliebig viele: Quelle1=, Quelle2=, ... Nennen zwei Kataloge dasselbe
;  Plugin, gewinnt der erste.
;
;  Aufbau eines Katalogs: siehe katalog.ini neben dem Quelltext dieses
;  Plugins. Kurz:
;      [HelloButton]
;      Repo=github:aizpun-flowtech/amsapi
;      Path=samples/HelloButton
;  oder fuer ein Netzlaufwerk / einen Webserver:
;      [Intern]
;      Base=\\server\ams\plugins\Intern\
; ===========================================================================
[Katalog]
Quelle1=https://raw.githubusercontent.com/aizpun-flowtech/amsapi/HEAD/samples/PluginManager/katalog.ini
; Quelle2=\\server\ams\plugins\katalog.ini

; Nur zum Ausprobieren: ein anderer Ordner statt BIN\plugins.
; Leer = der Ordner, in dem dieses Plugin selbst liegt.
PluginsDir=

; ===========================================================================
;  [GitHub] - private Repos
;
;  Ein Fine-grained Personal Access Token mit "Contents: Read-only" auf die
;  Plugin-Repos genuegt. Er wird nur an github.com, api.github.com und
;  raw.githubusercontent.com geschickt, nie an andere Server.
;
;  ACHTUNG: Diese Datei liegt unter Program Files und ist fuer ALLE Benutzer
;  des Rechners lesbar. Besser TokenFile= auf eine Datei im eigenen Profil
;  oder die Umgebungsvariable AMS_GITHUB_TOKEN.
; ===========================================================================
[GitHub]
Token=
; Datei, deren Inhalt der Token ist. Umgebungsvariablen gehen.
TokenFile=%APPDATA%\AmsPluginManager\github.token
