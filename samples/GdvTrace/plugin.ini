; Plugin-Beschreibung fuer den AMS.5-Plugin-Manager.
; Der Ordner unter BIN\plugins\ muss so heissen wie Name=.
Name=GdvTrace
Module=GdvTrace.bpl
Version=1.0.0

LargeGlyph=./icon32.png

[Aufzeichnung]
; FELDEBENE: zusaetzlich jeden Feldzugriff des Uebersetzungsscripts mitschneiden
; (jeder Gdv.GetValue / GetWahl, dazu GetSatzNummer / GetVertragStatus).
; Zeigt GENAU, welche GDV-Felder das JS liest - aber sehr viele Zeilen pro
; Vertrag. Standard aus; zum Nachvollziehen eines einzelnen Vertrags anschalten.
Feldebene=0

; Zusaetzlich den Datenbankverkehr (SQL) und die Actions mitschneiden - zeigt,
; welche UPDATE/INSERT der Schreibvorgang (ExportItem) ausloest.
MitSQL=1

; Ab dieser Laenge werden Detailtexte gekuerzt.
MaxDetail=300

; Wie viele Zeilen das Fenster im Speicher haelt (ein GDV-Lauf ist lang).
Zeilenpuffer=4000

; Zusaetzlich ins normale Log schreiben (%TEMP%\GdvTrace.log).
AuchInsLog=0

; Verlaufsfenster sofort mit dem Hauptfenster oeffnen, ohne Knopfdruck.
FensterBeimStart=0

; ===========================================================================
;  [Info] - was der Plugin Manager anzeigt. AMS liest diesen Abschnitt nicht.
; ===========================================================================
[Info]
Title=GDV-Trace
Description=Schneidet den GDV-Import mit: Einlesen, Zuordnen, Schreiben und jeden Aufruf des Uebersetzungsscripts, auf Wunsch bis auf Feldebene.
Author=Flowtech
License=intern
Tags=Diagnose, GDV
Icon=icon32.png
