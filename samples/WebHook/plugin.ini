Name=WebHook
Module=WebHook.bpl
Version=1.0.0

; ------------------------------------------------------------ Beschriftung
Caption=Webhook
Hint=Sendet eine HTTP-Anfrage
LargeGlyph=./icon32.png

; -------------------------------------------------------------- Die Anfrage
Url=https://example.invalid/hook
HttpMethod=POST
; Mehrere Header mit | trennen - in einer INI gibt es kein CRLF.
HttpHeaders=Content-Type: application/json|X-Quelle: AMS
HttpBody={"quelle":"ams5"}

; Ergebnis als Meldung zeigen? 1 = ja (Standard), 0 = nur ins Log.
ShowResult=1

